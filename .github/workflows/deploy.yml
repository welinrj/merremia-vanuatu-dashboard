name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Build NBSAP portal
        env:
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}
        run: |
          cd nbsap-portal
          npm ci
          npm run build

      # Copy static HTML pages into the deploy output
      - name: Copy static pages to dist
        run: |
          cp index.html dist/
          cp dashboard.html dist/
          cp dashboard-live.html dist/
          cp merremia-connector.js dist/
          cp -r assets dist/
          cp -r field-collector dist/
          cp -r nbsap-portal/dist dist/nbsap-portal

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-firestore-rules:
    runs-on: ubuntu-latest
    # Deploy Firestore rules only when pushing to main
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore security rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "⚠️  FIREBASE_SERVICE_ACCOUNT secret not configured — skipping Firestore rules deployment."
            echo "To enable: add FIREBASE_SERVICE_ACCOUNT secret (Firebase Console → Project Settings → Service Accounts → Generate key)"
            exit 0
          fi
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          firebase deploy --only firestore:rules --project vanuatu-nbsap-dashboard-9909a --non-interactive
          rm /tmp/sa.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only deploy from main branch, not from PR/feature branches
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

