<!--
  Kunming-Montreal Global Biodiversity Framework Logo Placeholder
  ================================================================
  IMPORTANT: Replace this placeholder with the official KM-GBF logo.
  The official logo is available from:
    https://www.cbd.int/gbf/
    https://www.cbd.int/article/kunming-montreal-global-framework

  To replace: save the official logo as "kunming-montreal-gbf.svg" (or .png)
  in this same directory (public/logos/) and update the <img> src in:
    src/ui/components/nationalReport/sections/s00_cover.js
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 80" width="180" height="80">
  <defs>
    <linearGradient id="gbfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#005b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007a45;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect x="1" y="1" width="178" height="78" rx="10" ry="10"
        fill="url(#gbfGrad)" stroke="#004d2c" stroke-width="1.5"/>

  <!-- Leaf motif left -->
  <g transform="translate(14,22)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="9" ry="5" fill="#6fcf97" transform="rotate(-40)"/>
    <ellipse cx="0" cy="0" rx="9" ry="5" fill="#27ae60" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="9" ry="5" fill="#219150" transform="rotate(40)"/>
    <line x1="0" y1="0" x2="0" y2="14" stroke="#a8e6c0" stroke-width="1.2"/>
  </g>

  <!-- "KM-GBF" acronym -->
  <text x="33" y="28" font-family="Georgia, serif" font-size="17"
        font-weight="bold" fill="#ffffff" letter-spacing="1">KM-GBF</text>

  <!-- Full name line 1 -->
  <text x="33" y="42" font-family="Arial, sans-serif" font-size="7"
        fill="rgba(255,255,255,0.9)" letter-spacing="0.3">Kunming-Montreal</text>

  <!-- Full name line 2 -->
  <text x="33" y="52" font-family="Arial, sans-serif" font-size="7"
        fill="rgba(255,255,255,0.9)" letter-spacing="0.3">Global Biodiversity</text>

  <!-- Full name line 3 -->
  <text x="33" y="62" font-family="Arial, sans-serif" font-size="7"
        fill="rgba(255,255,255,0.9)" letter-spacing="0.3">Framework</text>

  <!-- COP15 badge -->
  <rect x="131" y="52" width="36" height="16" rx="4" fill="rgba(255,255,255,0.15)"
        stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
  <text x="149" y="63" font-family="Arial, sans-serif" font-size="7"
        fill="rgba(255,255,255,0.85)" text-anchor="middle">COP 15 · 2022</text>
</svg>
